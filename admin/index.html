<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Cup 2026 Draw Bot</title>
<style>
:root{
  --g:#16a34a;--gL:#dcfce7;--gS:#f0fdf4;--gD:#15803d;--gDD:#14532d;
  --red:#dc2626;--border:#e2e8f0;--text:#0f172a;--text2:#1e293b;--muted:#64748b;
  --r:14px;
  --shadow:0 4px 6px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#052e16 0%,#14532d 35%,#166534 65%,#15803d 100%);
  color:var(--text);
}

/* ── HERO ──────────────────────────────────────── */
.hero{
  text-align:center;padding:3rem 1.5rem 2rem;color:#fff;
  flex-shrink:0;
}
.hero .trophy{font-size:4rem;line-height:1;margin-bottom:.75rem}
.hero h1{font-size:2rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.4rem}
.hero p{font-size:1rem;opacity:.8;line-height:1.5}

/* ── CARD ──────────────────────────────────────── */
.card-wrap{
  flex:1;display:flex;align-items:flex-start;justify-content:center;
  padding:0 1.5rem 3rem;
}
.card{
  background:#fff;border-radius:var(--r);padding:2.25rem;
  max-width:420px;width:100%;
  box-shadow:var(--shadow);
}
.card-title{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:.25rem;letter-spacing:-.15px}
.card-sub{font-size:.84rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.5}

/* ── FORM ──────────────────────────────────────── */
.form-row{margin-bottom:1rem}
.form-row label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:.3rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input{
  border:1.5px solid var(--border);border-radius:8px;
  padding:.6rem .875rem;font-size:.95rem;font-family:inherit;
  width:100%;background:#fff;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.pin-field{letter-spacing:.35rem;font-size:1.25rem;text-align:center}

.btn-primary{
  width:100%;padding:.65rem;background:var(--g);color:#fff;
  border:none;border-radius:8px;font-size:.95rem;font-family:inherit;
  font-weight:600;cursor:pointer;transition:.2s;margin-top:.25rem;
  display:flex;align-items:center;justify-content:center;gap:.35rem;
}
.btn-primary:hover:not(:disabled){background:var(--gD);transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,163,74,.3)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

/* ── DIVIDER ───────────────────────────────────── */
.divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0}
.divider::before,.divider::after{content:'';flex:1;border-top:1px solid var(--border)}
.divider span{font-size:.75rem;color:var(--muted);white-space:nowrap;font-weight:500}

/* ── CREATE SECTION ────────────────────────────── */
.create-section{text-align:center}
.create-section p{font-size:.84rem;color:var(--muted);margin-bottom:.875rem;line-height:1.5}
.btn-outline{
  width:100%;padding:.62rem;background:transparent;color:var(--g);
  border:1.5px solid var(--g);border-radius:8px;font-size:.9rem;
  font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:.35rem;
}
.btn-outline:hover{background:var(--gS)}

/* ── ERROR ─────────────────────────────────────── */
.error{color:var(--red);font-size:.82rem;margin-top:.4rem;min-height:1.1rem}

/* ── FOOTER ────────────────────────────────────── */
.footer{text-align:center;padding:.75rem;color:rgba(255,255,255,.4);font-size:.75rem}
.footer a{color:rgba(255,255,255,.55);text-decoration:none}
.footer a:hover{color:rgba(255,255,255,.8)}
</style>
</head>
<body>

<div class="hero">
  <div class="trophy">⚽🏆</div>
  <h1>World Cup 2026 Draw Bot</h1>
  <p>Daily WhatsApp updates · Live scores · Group sweepstake</p>
</div>

<div class="card-wrap">
  <div class="card">

    <div class="card-title">Sign in to your draw</div>
    <div class="card-sub">Enter the draw name and the 6-digit PIN you set when creating it.</div>

    <div class="form-row">
      <label>Draw Name</label>
      <input type="text" id="login-name" placeholder="e.g. Work Lads 2026" autocomplete="off"
             onkeydown="if(event.key==='Enter')document.getElementById('login-pin').focus()"/>
    </div>
    <div class="form-row">
      <label>6-Digit PIN</label>
      <input class="pin-field" type="password" id="login-pin" maxlength="6"
             inputmode="numeric" pattern="\d{6}" placeholder="••••••"
             onkeydown="if(event.key==='Enter')signIn()"/>
      <div class="error" id="login-err"></div>
    </div>
    <button class="btn-primary" id="login-btn" onclick="signIn()">Enter Draw →</button>

    <div class="divider"><span>or</span></div>

    <div class="create-section">
      <p>Starting a new sweepstake for your group?</p>
      <button class="btn-outline" onclick="location.href='/setup'">✨ Create a New Draw</button>
    </div>

  </div>
</div>

<div class="footer">
  <a href="/admin">Admin dashboard</a>
</div>

<script>
async function signIn() {
  const name = document.getElementById('login-name').value.trim();
  const pin  = document.getElementById('login-pin').value;
  const err  = document.getElementById('login-err');
  err.textContent = '';

  if (!name) { err.textContent = 'Enter your draw name.'; return; }
  if (!/^\d{6}$/.test(pin)) { err.textContent = 'PIN must be exactly 6 digits.'; return; }

  const btn = document.getElementById('login-btn');
  btn.textContent = 'Signing in…'; btn.disabled = true;

  try {
    const r    = await fetch('/api/draw-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, pin })
    });
    const data = await r.json();

    if (!data.ok) {
      err.textContent = data.error || 'Incorrect draw name or PIN.';
      btn.textContent = 'Enter Draw →'; btn.disabled = false;
      return;
    }

    // Cache PIN in sessionStorage so manage page skips the gate
    sessionStorage.setItem('wc_pin_' + data.slug, pin);
    location.href = '/manage/' + data.slug;
  } catch(e) {
    err.textContent = 'Something went wrong. Please try again.';
    btn.textContent = 'Enter Draw →'; btn.disabled = false;
  }
}
</script>
</body>
</html>
